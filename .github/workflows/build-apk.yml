
name: Build Cafeteria Attendance APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o restaurant_android_apk_build_bundle.zip
          cp -R restaurant_android_apk_build/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: cafeteria-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
